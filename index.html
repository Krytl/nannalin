if (id === "cal") {
  const events = [
    { d: "2026-10-27", t: 'iQIYI Original "Under Her Rules" Official Trailer OUT NOW' },
    { d: "2026-10-28", t: 'iQIYI Original "Under Her Rules" OST Teaser' },
    { d: "2026-10-30", t: 'iQIYI Original "Under Her Rules" OST MV — OUT NOW' },
    { d: "2026-10-31", t: "EP.0 Premiere — 8:00 PM ICT on iQIYI" },
    { d: "2026-11-01", t: "1st EP Fan Screening — Ticket Sales Open" },
    { d: "2026-11-05", t: "iQIYI iJOY TH2027 — ICONSIAM HALL, 7th Floor, ICONSIAM" },
    { d: "2026-11-07", t: 'iQIYI Original "Under Her Rules" Premiere — UNCUT version every Saturday at 8:00 PM ICT on iQIYI and IQ.com' }
  ];

  const n = new Date();
  const months = [{ y: 2026, m: 9 }, { y: 2026, m: 10 }];
  let content = "";

  for (const { y, m } of months) {
    const f = new Date(y, m, 1).getDay();
    const tot = new Date(y, m + 1, 0).getDate();
    let cells = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"]
      .map(x => `<b>${x}</b>`).join("") + "<span></span>".repeat(f);

    for (let d = 1; d <= tot; d++) {
      const iso = `${y}-${p2(m + 1)}-${p2(d)}`;
      const dt = new Date(y, m, d);
      const air = dt.getDay() === 6 && dt >= START;
      const e = events.find(x => x.d === iso);
      const today = d === n.getDate() && m === n.getMonth() && y === n.getFullYear();

      cells += `<span class="${today ? "td" : ""} ${air || e ? "dt" : ""}">${d}</span>`;
    }

    content += `<h3>${M[m]} ${y + 543}</h3><div class="cg">${cells}</div>`;

    const monthEvents = events.filter(e => e.d.startsWith(`${y}-${p2(m + 1)}-`));
    content += monthEvents.map(e => {
      const day = Number(e.d.slice(-2));
      return `<div class="ev"><b>${day} ${M[m].slice(0, 3)}.</b> ${e.t}</div>`;
    }).join("");
  }

  return show("Calendar · Under Her Rules", content);
}

if (id === "youtube") { const vid = "Mrm0Ej8e_Yw", url = `https://www.youtube.com/watch?v=${vid}`; return show("YouTube", `
  <div style="padding:12px;color:#222;background:#fff;min-height:100%;border-radius:14px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:18px;">
      <span style="font-size:25px;color:#ff0033;">▶</span>
      <b style="font-size:21px;">YouTube</b>
      <span style="margin-left:auto;font-size:20px;">🔔</span>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:18px;">
      <div style="flex:1;padding:11px;border:1px solid #ddd;border-radius:22px;font-size:13px;color:#777;">Search YouTube</div>
      <span style="padding:9px;background:#f2f2f2;border-radius:50%;">🔍</span>
    </div>
    <a href="${url}" target="_blank" rel="noopener" style="display:block;position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000 url('https://img.youtube.com/vi/${vid}/hqdefault.jpg') center/cover;">
      <span style="position:absolute;inset:0;display:grid;place-items:center;"><span style="width:62px;height:44px;background:#ff0033;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:20px;">▶</span></span>
    </a>
    <div style="font-size:15px;font-weight:600;margin-top:12px;">Watch on YouTube</div>
    <div style="font-size:12px;color:#777;margin-top:6px;">YouTube · Video</div>
    <a href="${url}" target="_blank" rel="noopener" style="display:block;margin-top:16px;padding:12px;background:#ff0033;color:white;text-align:center;text-decoration:none;border-radius:22px;font-size:14px;">▶ Open in YouTube</a>
  </div>
`); }

if (id === "phone") return show("ล่าสุด", C.calls.map(c => `<div class="li"><div class="m"><b style="${c.x ? "color:#ff453a" : ""}">${c.n}</b><small>${c.x ? "↙ สายที่ไม่ได้รับ" : (c.o ? "↗ โทรออก" : "↙ โทรเข้า") + " · " + c.s}</small></div><small style="flex:none">${c.w}</small></div>`).join(""));

}
const closeApp = () => $("#app").classList.remove("on");

/* ปลดล็อก */
let pin = "";
const L = C.passcode.length;
$("#pad").innerHTML = [1,2,3,4,5,6,7,8,9,0].map(k => `<button data-act="key" data-v="${k}" ${k === 0 ? 'class="z"' : ""}>${k}</button>`).join("");
const dots = () => $("#dots").innerHTML = Array.from({ length: L }, (_, i) => `<i class="${i < pin.length ? "f" : ""}"></i>`).join("");
dots();
function key(k) {
  if (pin.length >= L) return; pin += k; dots();
  if (pin.length === L) setTimeout(() => {
    if (pin === C.passcode) { $("#pass").classList.remove("on"); $("#lock").classList.add("up"); pin = ""; dots(); }
    else { $("#dots").classList.add("shake"); $("#ptitle").textContent = "ยังไม่ถูก ใครอยากรู้ ต้องจำวันนั้นให้ได้";
      setTimeout(() => { $("#dots").classList.remove("shake"); pin = ""; dots(); }, 400); }
  }, 120);
}
const openPass = () => { $("#pass").classList.add("on"); $("#ptitle").textContent = "ใส่รหัสผ่าน"; pin = ""; dots(); };
document.addEventListener("keydown", e => { if ($("#pass").classList.contains("on") && /^\d$/.test(e.key)) key(e.key); });
let y0 = null;
$("#lock").addEventListener("touchstart", e => y0 = e.touches[0].clientY, { passive: true });
$("#lock").addEventListener("touchend", e => { if (y0 !== null && y0 - e.changedTouches[0].clientY > 60) openPass(); y0 = null; });

$(".phone").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === "pass") openPass(); else if (a === "cancel") $("#pass").classList.remove("on");
  else if (a === "key") key(v); else if (a === "app") openApp(v); else if (a === "home") closeApp();
  else if (a === "lines") lineList(); else if (a === "chat") lineChat(+v); else if (a === "send") send(+v);else if (a === "msgchat") messageChat(+v);
else if (a === "msgback") messageList();
else if (a === "msgsend") messageSend(+v);
else if (a === "igpost") igPost(+v);
else if (a === "igback") openApp("ig");
else if (a === "note") noteOpen(+v); else if (a === "notelist") noteList();
  else if (a === "alarm") { C.alarms[v].on ^= 1; openApp("clock"); }
  else if (a === "open") window.open(v, "_blank", "noopener");
});
</script>
